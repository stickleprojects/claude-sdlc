# Every Claude persona in the pipeline, and the GitHub identity it acts as.
# scripts/agent-identity.sh reads this file; a test keeps it in step with the skills and
# workflows. See docs/agent-identity.md.
#
# --- identities -----------------------------------------------------------------------------
# identity <name> <kind> <credentials>
#   kind github-app: an App you create (docs/agent-identity.md). Locally it's set up with
#     `scripts/agent-identity.sh setup --identity <name> …`, which writes
#     ~/.config/sdlc/<name>.env and keeps the private key in the keyring. In CI the workflows
#     read the repo variables SDLC_<NAME>_APP_ID and SDLC_<NAME>_APP_SLUG and the secret
#     SDLC_<NAME>_APP_KEY, which bootstrap-github.sh sets.
#   kind claude-app: Anthropic's Claude GitHub App (claude[bot]), driven by claude-code-action
#     with the CLAUDE_CODE_OAUTH_TOKEN secret. CI only.
identity agent   github-app  ~/.config/sdlc/agent.env + keyring; CI: SDLC_AGENT_APP_ID, SDLC_AGENT_APP_SLUG, SDLC_AGENT_APP_KEY
identity claude  claude-app  CI: CLAUDE_CODE_OAUTH_TOKEN

# --- personas -------------------------------------------------------------------------------
# persona <name> <identity> <where> <what it does>
#   To give a persona its own App, add an identity line for it, point the persona at it, and
#   run `scripts/agent-identity.sh setup --identity <name> …`. CI personas use the agent
#   identity only (SDLC_AGENT_*) for now.
persona intent     agent   local  drafts intent.md or bug.md (intent skill)
persona spec       agent   local  writes spec.md by hand (spec skill)
persona plan       agent   local  saves plan.md (plan skill)
persona build      agent   local  builds milestones and opens the PR (/build)
persona dev        agent   local  other code changes; handles code review findings (review-findings skill)
persona po-review  agent   local  records product owner decisions on intent and spec PRs (po-review skill)
persona spec-ci    agent   ci     generates specs and opens spec PRs (spec-from-intent.yml)
persona reviewer   claude  ci     reviews PRs and posts findings (claude-review.yml)
persona mention    claude  ci     answers @claude comments from people (claude-mention.yml)
