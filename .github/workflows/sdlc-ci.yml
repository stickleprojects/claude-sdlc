name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run for its old head, queued or in progress (#138): on a
# self-hosted runner that runs one job at a time, the stale run would hold up the current one.
# A push to main gets a group of its own commit: a group keeps only one pending run, and a
# shared one would let the next merge replace it, leaving that commit with no result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ vars.SDLC_RUNNER && !github.event.issue.pull_request && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && vars.SDLC_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # make validate and the docs-only check compare the branch with main
      - uses: ./.github/actions/setup-stack
      # Pushes to main pass FULL=1, so every commit there is fully tested. This repo's own
      # `check` skips the tests on a docs-only PR (#140); a consumer's `check` decides for itself,
      # and on a PR gets no FULL at all, so its own default stands.
      - run: make check ${{ github.event_name == 'push' && 'FULL=1' || '' }}
