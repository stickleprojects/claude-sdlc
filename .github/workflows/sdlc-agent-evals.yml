# Stage 4 (Test): evals for the agent configuration itself. A falling pass rate blocks
# the config change.
#
# On-demand only for now: the token is tied to a Claude subscription, which has limited
# usage. The playbook runs this automatically; to do that, add these triggers:
#   pull_request:
#     paths: ["CLAUDE.md", ".sdlc/REVIEW.md", ".claude/**", ".sdlc/prompts/**", "evals/**", ".sdlc/scripts/agent.sh"]
#   schedule:
#     - cron: "0 3 * * *"
name: Agent evals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ${{ (vars.SDLC_RUNNER_HEAVY || vars.SDLC_RUNNER) && !github.event.issue.pull_request && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (vars.SDLC_RUNNER_HEAVY || vars.SDLC_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-stack
        # Needs (#239, .sdlc/docs/stack-needs.md): the evals.
        env:
          SDLC_STACK_NEEDS: full
      - run: .sdlc/scripts/install-claude.sh  # job-local, never global (#136)
      - run: make evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
