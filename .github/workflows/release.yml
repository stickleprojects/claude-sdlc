# Cut a framework release: work out the version from PR titles, check, tag, and publish
# release notes grouped by change type (scripts/release-notes.sh). GitHub Releases are the
# changelog; a CHANGELOG.md file would need a push to the protected main branch.
# Run from Actions → Release → Run workflow, or: gh workflow run release.yml
# Framework-only: .sdlc/scripts/sync-sdlc.sh doesn't copy this file to consumer repos.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show the version that would be released"
        type: boolean
        default: true
      trial:
        description: "Consumer trial result for the notes, e.g. 'stickleprojects/sdlc-sandbox#12: make check and CI passed' (/release skill; required unless a dry run)"
        type: string
        default: ""
      # No option to skip the agent evals: every release runs every test (make check FULL=1)
      # and every eval before it tags, so nothing is released less checked than the last one.

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ (vars.SDLC_RUNNER_HEAVY || vars.SDLC_RUNNER) && !github.event.issue.pull_request && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (vars.SDLC_RUNNER_HEAVY || vars.SDLC_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the next version
        id: version
        env:
          SDLC_TRIAL: ${{ inputs.trial }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A release is tried in a consumer first (#200, scripts/consumer-trial.sh).
          if [[ "$DRY_RUN" != true && -z "$SDLC_TRIAL" ]]; then
            echo "::error::no consumer trial: run the /release checklist and pass its result as -f trial=..."; exit 1
          fi
          version=$(scripts/next-version.sh --explain 2> explain.txt) || { cat explain.txt; echo "::error::nothing to release"; exit 1; }
          cat explain.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
          scripts/release-notes.sh "$version" "$GITHUB_REPOSITORY" > notes.md
          { echo "### Next version: \`$version\`"; echo '```'; cat explain.txt; echo '```';
            echo; echo "### Release notes preview"; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-stack
        if: ${{ !inputs.dry_run }}
      - run: make check FULL=1  # a release always runs every test (#140)
        if: ${{ !inputs.dry_run }}
      - name: Agent evals
        if: ${{ !inputs.dry_run }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          bin="$(.sdlc/scripts/install-claude.sh)"  # job-local, never global (#136)
          PATH="$bin:$PATH" make evals
      - name: Tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
