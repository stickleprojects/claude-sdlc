# Stage 5 (Deploy): AI review pass on every PR, following REVIEW.md.
# Findings are comments only. Branch protection still requires a code owner's approval.
# Reviews run when a PR opens or leaves draft, not on every push: each review uses Claude
# subscription limits (#11). Add the `review` label to review the latest push again.
# Exception: a repo that opts into auto-merge (SDLC_AUTO_MERGE, #89; `off` is off, by THE RULE in
# scripts/auto-merge.sh, and expression comparisons ignore case) requires the `claude-review`
# commit status, and required checks belong to the head commit, so there it runs on every push.
# The job posts that status itself, pending at the start and success once the review is posted.
# A job skipped by its `if` (another label, say) posts nothing, so it can't satisfy the
# requirement the way the job's own `review` check run could (#101).
# Every repo requires `claude-review`, so nobody merges on a stale review (#46): without
# auto-merge, a push isn't reviewed, and the `unreviewed-push` job marks its commit as not
# reviewed, with what to do. The `review` label then reviews it.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  statuses: write

jobs:
  review:
    # Skip PRs from forks: they get no secrets, and outside contributors shouldn't spend the token.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'review') &&
      (github.event.action != 'synchronize' ||
        (vars.SDLC_AUTO_MERGE != '' && vars.SDLC_AUTO_MERGE != 'off'))
    runs-on: ${{ vars.SDLC_RUNNER && (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && vars.SDLC_RUNNER || 'ubuntu-latest' }}
    # One review per PR at a time: a newer push or `review` label replaces a review still
    # running on an older commit. On the job, not the workflow, so a skipped run (another
    # label, or a push without auto-merge) never cancels a review in progress.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark the review as running
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent -f state=pending
          -f context=claude-review -f description="The Claude review is running"
      # Remove the label first, so adding it again asks for another review. Uses the REST API:
      # The gh pr subcommand fails in orgs hit by the Projects (classic) GraphQL deprecation.
      - name: Clear the review label
        if: github.event.action == 'labeled'
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/review" --silent
      # claude-code-action skips itself when the PR changes its own workflow (the file must
      # match main), yet the check still goes green. Say so on the PR (#14): when it opens, and on
      # a push whose own commits start touching such a file (#101), not on every later push.
      - name: Note when the AI review can't run
        id: workflow_change
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$base"...HEAD | grep -q '^\.github/workflows/claude-' || exit 0
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          case "${{ github.event.action }}" in
            opened | ready_for_review) note=1 ;;
            synchronize) git diff --name-only "$BEFORE" HEAD 2>/dev/null \
              | grep -q '^\.github/workflows/claude-' && note=1 ;;
          esac
          if [[ -n "${note:-}" ]]; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "AI review skipped: this PR changes a \`.github/workflows/claude-*.yml\` file, and the review action won't run until that file matches \`main\`. A code owner needs to review it by hand."
          fi
      # Clause coverage (#47): when the PR changes a spec.md or plan.md, check each changed
      # requirement's clauses with one small-model call each (scripts/clause-check.sh), and
      # hand the list to the review. Never fails the job: if it can't run, the review is told
      # so and splits the clauses itself (REVIEW.md, "Where the clauses come from").
      - name: Find the changed specs and plans
        id: artifacts
        run: |
          base="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          # A repo without the optional `clauses` target skips the check (and its stack setup)
          # quietly; the review then splits the clauses itself. `make -n` runs nothing.
          if git diff --name-only "$base" -- 'changes/*/spec.md' 'changes/*/plan.md' | grep -q . \
              && make -n clauses CHANGE=probe >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-stack
        if: steps.artifacts.outputs.changed == 'true'
        continue-on-error: true  # a consumer's stack failing here mustn't stop the review
      - name: Clause check
        if: steps.artifacts.outputs.changed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          out="$RUNNER_TEMP/clause-check.json"
          if npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 \
              && scripts/clause-check.sh --changed-since "$BASE" > "$out" 2> "$RUNNER_TEMP/clause-check.err"; then
            :
          else
            jq -n --arg e "$(tail -n 5 "$RUNNER_TEMP/clause-check.err" 2>/dev/null)" \
              '[{unchecked: ("the clause check could not run: " + $e)}]' > "$out"
          fi
          cp "$out" .clause-check.json
          echo "Clause check: $(jq length .clause-check.json) entries"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs and pushes from the agent's own App identity (docs/agent-identity.md) are reviewed
          # like a person's, and so are spec PRs opened with the default token when there's no
          # App (github-actions[bot], #82). The review only comments, so it can't start a loop.
          # An empty slug leaves a blank entry, which the action ignores.
          allowed_bots: ${{ format('{0},github-actions', vars.SDLC_AGENT_APP_SLUG) }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow REVIEW.md exactly. Check the diff against the spec.md and plan.md
            of the change it implements (under changes/).

            If the file .clause-check.json exists in the workspace, it is the clause check's
            output for the specs and plans this PR changes: start clause coverage from it, as
            REVIEW.md's "Where the clauses come from" says. If it doesn't exist, the PR changes
            no spec.md or plan.md.

            This PR may have been reviewed before. First read the existing inline comments:
              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments
            Post an inline comment only for a finding that is new or still not addressed
            in a different way; never repeat one that is already there.

            Keep exactly one summary comment on the PR. If you posted one before, replace it:
              gh pr comment ${{ github.event.pull_request.number }} --edit-last --body "..."
            Only if that fails because there is none, create it with `gh pr comment`.
          # Automation mode allows only the tools listed here: read the PR, comment on it.
          claude_args: >-
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Read,Grep,Glob"
      # The required `claude-review` status (auto-merge repos, #101). Success says what happened;
      # a PR that changes a claude-*.yml workflow isn't AI-reviewed, so its description says a
      # code owner reviews it by hand, and scripts/auto-merge.sh never auto-merges such a PR.
      - name: Mark the review as done
        if: success()
        env:
          SKIPPED: ${{ steps.workflow_change.outputs.skipped }}
        run: |
          description="The Claude review is posted"
          [[ "$SKIPPED" == true ]] && description="No AI review: the PR changes a claude-*.yml workflow, so a code owner reviews it by hand"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent -f state=success \
            -f context=claude-review -f description="$description"
      - name: Mark the review as failed
        if: failure()
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent -f state=failure
          -f context=claude-review -f description="The Claude review failed: add the review label to run it again"

  # A push the review doesn't cover (auto-merge off): mark its commit as not reviewed, so the
  # required `claude-review` status says why and what to do instead of "Expected" (#46). No
  # model call; scripts/review-current.sh leaves a commit that already has a status alone.
  unreviewed-push:
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (vars.SDLC_AUTO_MERGE == '' || vars.SDLC_AUTO_MERGE == 'off')
    runs-on: ${{ vars.SDLC_RUNNER && (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && vars.SDLC_RUNNER || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/review-current.sh "$PR" "$HEAD_SHA"
