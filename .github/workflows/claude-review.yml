# Stage 5 (Deploy): AI review pass on every PR, following REVIEW.md.
# Findings are comments only. Branch protection still requires a code owner's approval.
# Reviews run when a PR opens or leaves draft, not on every push: each review uses Claude
# subscription limits (#11). Add the `review` label to review the latest push again.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Skip PRs from forks: they get no secrets, and outside contributors shouldn't spend the token.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Remove the label first, so adding it again asks for another review. Uses the REST API:
      # The gh pr subcommand fails in orgs hit by the Projects (classic) GraphQL deprecation.
      - name: Clear the review label
        if: github.event.action == 'labeled'
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/review" --silent
      # claude-code-action skips itself when the PR changes its own workflow (the file must
      # match main), yet the check still goes green. Say so on the PR (#14).
      - name: Note when the AI review can't run
        if: github.event.action != 'labeled'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -q '^\.github/workflows/claude-'; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "AI review skipped: this PR changes a \`.github/workflows/claude-*.yml\` file, and the review action won't run until that file matches \`main\`. A code owner needs to review it by hand."
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow REVIEW.md exactly. Check the diff against the spec.md and plan.md
            of the change it implements (under changes/).

            This PR may have been reviewed before. First read the existing inline comments:
              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments
            Post an inline comment only for a finding that is new or still not addressed
            in a different way; never repeat one that is already there.

            Keep exactly one summary comment on the PR. If you posted one before, replace it:
              gh pr comment ${{ github.event.pull_request.number }} --edit-last --body "..."
            Only if that fails because there is none, create it with `gh pr comment`.
          # Automation mode allows only the tools listed here: read the PR, comment on it.
          claude_args: >-
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Read,Grep,Glob"
