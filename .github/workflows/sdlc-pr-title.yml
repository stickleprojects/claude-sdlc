# PR titles become the commit messages that drive semantic versioning
# (scripts/next-version.sh) and the release notes, so they must follow the convention. A PR that
# changes a gate artifact (intent, bug, spec or plan) must also say so in its type (#46).
# The same job holds "no code before the plan" (#44): a change's branch that changes code needs
# its plan.md, which the plan-gate hook alone can't guarantee.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# A newer push or title edit on the same PR cancels the older check (#138).
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ${{ vars.SDLC_RUNNER && !github.event.issue.pull_request && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && vars.SDLC_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' \
            > "$RUNNER_TEMP/files.txt"
          .sdlc/scripts/check-pr-title.sh "$TITLE" < "$RUNNER_TEMP/files.txt"
      - name: No code before the plan
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: .sdlc/scripts/check-plan-first.sh "$HEAD_REF" < "$RUNNER_TEMP/files.txt"
