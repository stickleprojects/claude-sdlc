# Stage 2 (Design), automated: when an accepted intent.md (or bug.md) merges to main, generate
# spec.md and open it as a PR for the product owner. The agent never commits to main.
# One PR per change, from branch spec/<slug>: a change whose spec PR is still open is skipped,
# so intents merged close together never regenerate (and leave stale) each other's spec.
name: Spec from intent

on:
  push:
    branches: [main]
    paths: ["changes/*/intent.md", "changes/*/bug.md"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Runs queue rather than overlap, so the second run sees the first run's PRs.
concurrency:
  group: spec-from-intent
  cancel-in-progress: false

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stack
      - name: Find intents and bugs without a spec (or an open spec PR)
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(scripts/spec-pr.sh pending)
          echo "pending<<EOF" >> "$GITHUB_OUTPUT"; echo "$pending" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Generate specs
        if: steps.find.outputs.pending != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PENDING: ${{ steps.find.outputs.pending }}
        run: |
          npm install -g @anthropic-ai/claude-code
          { cat prompts/spec-from-intent.md; echo "$PENDING"; } | scripts/agent.sh -
      - name: Open one PR per change
        if: steps.find.outputs.pending != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING: ${{ steps.find.outputs.pending }}
        run: |
          # shellcheck disable=SC2086  # one change folder per word
          scripts/spec-pr.sh open $PENDING
