# Stage 5 (Deploy): AI review pass on every PR, following .sdlc/REVIEW.md.
# Findings are comments only. Branch protection still requires a code owner's approval.
# Reviews run when a PR opens or leaves draft, not on every push: each review uses Claude
# subscription limits (#11). Add the `review` label to review the latest push again.
# Exception: a repo that opts into auto-merge (SDLC_AUTO_MERGE, #89; `off` is off, by THE RULE in
# .sdlc/scripts/auto-merge.sh, and expression comparisons ignore case) requires the `claude-review`
# commit status, and required checks belong to the head commit, so there it runs on every push.
# The job posts that status itself, pending at the start and success once the review is posted
# and each Important finding it lists has an open thread (#130). That check is what makes an
# approval given before the review posts safe: conversation resolution then holds the merge.
# A job skipped by its `if` (another label, say) posts nothing, so it can't satisfy the
# requirement the way the job's own `review` check run could (#101).
# Every repo requires `claude-review`, so nobody merges on a stale review (#46): without
# auto-merge, a push isn't reviewed, and the `unreviewed-push` job marks its commit as not
# reviewed (pending), with what to do, and cancels a review of an older commit (#277). The
# `review` label then reviews it. A push that only merges the base in, leaving the PR's diff as
# reviewed (GitHub's Update branch), keeps its review (#182).
#
# It runs on pull_request_target, so GitHub runs main's copy of this file (ADR 0001, #293): a PR
# can't change how its own review runs, and a PR that changes a workflow gets an AI review like any
# other. The job has secrets and a token that can write, so it never runs the PR's code. Main is
# checked out at the workspace root, and everything the job runs comes from there. The PR's head is
# in pr/, as data: no credentials, and nothing in it is run, sourced or made. A PR that changes a
# file that sets CI's rules also gets a `CI change: needs approval` thread, posted by the job, which
# a person settles (.sdlc/scripts/ci-change-thread.sh). The PR that moves a repo onto this file
# gets no run at all, since main's copy still listens to pull_request: sdlc-claude-review-
# transition.yml marks it for a review by hand.
name: Claude review
# The run's head is main's, so the name says what it reviews. sdlc-check-after-review.yml,
# request-review.sh and review-current.sh read it: keep "Claude review of #<pr> at <sha>".
run-name: "Claude review of #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"

on:
  pull_request_target:
    types: [opened, ready_for_review, labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  statuses: write

jobs:
  review:
    # Skip PRs from forks before any step runs: under pull_request_target they'd get main's secrets,
    # and outside contributors shouldn't spend the token.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'review') &&
      (github.event.action != 'synchronize' ||
        (vars.SDLC_AUTO_MERGE != '' && vars.SDLC_AUTO_MERGE != 'off'))
    runs-on: ${{ vars.SDLC_RUNNER && !github.event.issue.pull_request && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && vars.SDLC_RUNNER || 'ubuntu-latest' }}
    # One review per PR at a time: a newer push or `review` label replaces a review still
    # running on an older commit. On the job, not the workflow, so a skipped run (another
    # label, or a push without auto-merge) never cancels a review in progress.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      # Main, at the workspace root: every script, action and Makefile this job runs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The PR's commits, as git objects only, for the diffs below.
      - name: Fetch the PR's commits
        run: git fetch --quiet --no-tags origin "$HEAD_SHA"
      # The PR's head, as data for the review to read (ADR 0001): no credentials, never run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      # A minute's margin for clock skew between the runner and GitHub: the summary has to be
      # posted or edited after this, or the review didn't happen (.sdlc/scripts/review-posted.sh).
      - name: Mark the review as running
        id: start
        run: |
          since="$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-1M +%Y-%m-%dT%H:%M:%SZ)"  # GNU, then BSD
          echo "since=$since" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent -f state=pending \
            -f context=claude-review -f description="The Claude review is running"
      # Remove the label first, so adding it again asks for another review. Uses the REST API:
      # The gh pr subcommand fails in orgs hit by the Projects (classic) GraphQL deprecation.
      - name: Clear the review label
        if: github.event.action == 'labeled'
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/review" --silent
      # A Dependabot PR isn't AI-reviewed: its diff is a tag and a SHA, and what matters (the
      # action's release notes, the runner version it needs) isn't in it. A PR that changes a
      # review workflow is reviewed like any other, since main's copy runs (ADR 0001).
      - name: Note when the AI review can't run
        id: workflow_change
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$AUTHOR" == "dependabot[bot]" ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "why=dependabot" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event.action }}" == opened ]]; then
              gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "AI review skipped: this is a Dependabot update. Review it by hand: read the new version's release notes for breaking changes (inputs, the runner version it needs) and check who gets it through the sync."
            fi
          fi
      # A change to a file that sets CI's rules (.github/, the hooks, .claude/settings.json,
      # uv.lock) needs a person's approval, in one thread the job posts itself (ADR 0001), before
      # the review reads the threads. If it can't be posted, the job fails: a CI change is never
      # left unflagged.
      - name: Ask a person to approve a CI change
        run: .sdlc/scripts/ci-change-thread.sh "$PR" "$BASE" "$HEAD_SHA"
      # Clause coverage (#47): when the PR changes a spec.md or plan.md, check each changed
      # requirement's clauses with one small-model call each (.sdlc/scripts/clause-check.sh), and
      # hand the list to the review. Never fails the job: if it can't run, the review is told
      # so and splits the clauses itself (.sdlc/REVIEW.md, "Where the clauses come from").
      - name: Find the changed specs and plans
        id: artifacts
        run: |
          fork="$(git merge-base "$BASE" "$HEAD_SHA")"
          # A repo without the optional `clauses` target skips the check (and its stack setup)
          # quietly; the review then splits the clauses itself. `make -n` reads main's Makefile.
          if git diff --name-only "$fork" "$HEAD_SHA" -- 'changes/*/spec.md' 'changes/*/plan.md' | grep -q . \
              && make -n clauses CHANGE=probe >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-stack
        # Needs (#239, .sdlc/docs/stack-needs.md): make clauses, through $(SDLC).
        env:
          SDLC_STACK_NEEDS: validate
        if: steps.artifacts.outputs.changed == 'true'
        continue-on-error: true  # a consumer's stack failing here mustn't stop the review
      # Main's tool runs over the PR's specs and plans as data: a copy of main with only the PR's
      # changed changes/<slug>/ folders put in (.sdlc/scripts/overlay-changes.sh), never the PR's
      # Makefile or scripts.
      - name: Clause check
        if: steps.artifacts.outputs.changed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          out="$RUNNER_TEMP/clause-check.json"
          copy="$RUNNER_TEMP/clauses"
          # Claude Code goes in the job's temp folder, never globally (#136).
          if bin="$(.sdlc/scripts/install-claude.sh 2> "$RUNNER_TEMP/clause-check.err")" \
              && .sdlc/scripts/overlay-changes.sh "$copy" HEAD "$HEAD_SHA" > /dev/null 2>> "$RUNNER_TEMP/clause-check.err" \
              && (cd "$copy" && PATH="$bin:$PATH" .sdlc/scripts/clause-check.sh --changed-since HEAD) > "$out" 2>> "$RUNNER_TEMP/clause-check.err"; then
            :
          else
            jq -n --arg e "$(tail -n 5 "$RUNNER_TEMP/clause-check.err" 2>/dev/null)" \
              '[{unchecked: ("the clause check could not run: " + $e)}]' > "$out"
          fi
          cp "$out" .clause-check.json
          echo "Clause check: $(jq length .clause-check.json) entries"
      # The rules the review follows, with the project's override (.sdlc-local/REVIEW.md, #133)
      # applied, as main has them: a PR can't weaken the rules for its own review.
      - name: Review rules
        run: .sdlc/scripts/resolve.sh REVIEW.md > .review-rules.md
      # The PR's review threads and whether each is resolved (#220). REST comments don't say, and
      # the review's tools can't run GraphQL, so without this it guessed: a second needs-approval
      # thread, a fixed finding counted as open. Read with the job's token, by main's copy of the
      # script, so a PR can't change what its own review sees.
      - name: Read the review threads
        run: |
          if ! .sdlc/scripts/review-threads.sh "$PR" > .review-threads.json 2> "$RUNNER_TEMP/review-threads.err"; then
            jq -n --arg e "$(tail -n 3 "$RUNNER_TEMP/review-threads.err" 2>/dev/null)" \
              '{unreadable: ("the review threads could not be read: " + $e)}' > .review-threads.json
          fi
          echo "Review threads: $(jq 'if type == "array" then length else "unreadable" end' .review-threads.json)"
      # The summary this review replaces, and the PR's commits (#242): a re-review marks each
      # earlier note addressed or still open. Read the same way as the threads, for the same reason.
      # It also says how to post this review's summary: a first review creates the comment and a
      # re-review edits it. Told to try --edit-last first, a first review put a stub in the
      # fallback, and its findings were lost (#266). If unsure, --edit-last keeps it to one comment.
      - name: Read the earlier summary
        id: earlier
        run: |
          if ! .sdlc/scripts/review-earlier-summary.sh "$PR" > .review-earlier-summary.md 2> "$RUNNER_TEMP/earlier-summary.err"; then
            printf '# The earlier summary could not be read\n\n%s\n' \
              "$(tail -n 3 "$RUNNER_TEMP/earlier-summary.err" 2>/dev/null)" > .review-earlier-summary.md
          fi
          head -n 1 .review-earlier-summary.md
          edit="--edit-last "
          [[ "$(head -n 1 .review-earlier-summary.md)" != "# No earlier summary" ]] || edit=""
          echo "edit=$edit" >> "$GITHUB_OUTPUT"
      - name: Review
        id: review
        if: steps.workflow_change.outputs.why != 'dependabot'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs and pushes from the agent's own App identity (.sdlc/docs/agent-identity.md) are reviewed
          # like a person's, and so are spec PRs opened with the default token when there's no
          # App (github-actions[bot], #82). The review only comments, so it can't start a loop.
          # SDLC_REVIEW_EXTRA_BOTS adds the project's dependency bots (#142), e.g. `renovate` or
          # `renovate,dependabot`, so their PRs get reviewed and can pass the required check.
          # An unset variable leaves a blank entry, which the action ignores.
          allowed_bots: ${{ format('{0},github-actions,{1}', vars.SDLC_AGENT_APP_SLUG, vars.SDLC_REVIEW_EXTRA_BOTS) }}
          # The action holds inline comments back and drops any it judges to be tests once the
          # session ends. A dropped finding is a finding nothing blocks on (#130), so post them all.
          classify_inline_comments: false
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow the review rules in .review-rules.md exactly (.sdlc/REVIEW.md with this
            project's overrides applied). Check the diff against the spec.md and plan.md
            of the change it implements (under pr/changes/).

            The workspace root is the base branch, for the rules and context only. The PR's
            files, as of its head, are under pr/: review those, and `gh pr diff` for the diff.
            A comment's path is the repo's path, without pr/. A thread that starts with
            "CI change: needs approval" is this job's own: never post one yourself.

            This repo's SDLC_BUILD_AMENDS_PLAN variable is '${{ vars.SDLC_BUILD_AMENDS_PLAN }}'
            (`on` lets a build PR amend its plan: the rules' "A build PR that amends its plan").

            If the file .clause-check.json exists in the workspace, it is the clause check's
            output for the specs and plans this PR changes: start clause coverage from it, as
            the rules' "Where the clauses come from" says. If it doesn't exist, the PR changes
            no spec.md or plan.md.

            This PR may have been reviewed before. The file .review-threads.json lists its
            review threads as they were when this review started: each one's path, line,
            whether it is resolved or outdated, its first comment and its replies (`bot`
            is true for a bot or an App). Take thread state only from it. Never post a
            finding again whose thread is still unresolved, a needs-approval thread
            included. Post an inline comment only for a finding that is new or still not
            addressed in a different way. If the file holds {"unreadable": ...} instead,
            the threads couldn't be read: post no needs-approval thread that may already
            exist, and say in the summary that thread state couldn't be read.

            Every Important finding is its own thread starting with **Important (the rules'
            "Posting findings"), never only in the summary. When no line in the diff fits it,
            comment on the most relevant file with exactly:
              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments -f subject_type=file -f path=<file> -f commit_id=${{ github.event.pull_request.head.sha }} -f body=<finding>

            Keep exactly one summary comment on the PR. If you posted one before, replace it,
            but first read .review-earlier-summary.md: the summary you're replacing and the
            PR's commits. Mark each of its notes as the rules' "Summary comment" says. If it
            says it could not be read, say so in the summary. Post it with:
              gh pr comment ${{ github.event.pull_request.number }} ${{ steps.earlier.outputs.edit }}--body "..."
            The body is the whole summary. Never put a shorter one after `||`: if the command
            fails, run it again as its own command with the same whole body, without
            --edit-last if it failed because there is no comment to edit.
            A Nit with no thread is its own line in the summary, starting `- **Nit:**`. Never
            refer to a finding as "above": the PR shows only what you post.
            End it with the hidden count line, <!-- review-findings: important=<N> nit=<M> -->:
            N is the unresolved threads in .review-threads.json whose first comment is the
            review's own (author `claude`, bot true) and starts with **Important, plus the
            Important threads you post now. A resolved
            thread never counts. M is the Nits still open, in threads or in the summary. The
            job checks N against the open Important threads and that M Nits are written down,
            and fails if not.
          # Automation mode allows only the tools listed here: read the PR, comment on it.
          claude_args: >-
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments -f subject_type=file:*),Read,Grep,Glob"
      # The action can end "successfully" having posted nothing: four tool calls refused on #129,
      # #147 and #155 (#157). Say in the log which calls were refused, keep that run's output,
      # and review once more before failing. The retry is the same step: keep the two identical
      # (tests/scripts/test_review_silent_retry.py checks it).
      - name: Check the review posted its summary
        id: posted
        if: steps.workflow_change.outputs.skipped != 'true'
        env:
          SINCE: ${{ steps.start.outputs.since }}
        run: |
          if .sdlc/scripts/review-posted.sh "$PR" "$SINCE"; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
            .sdlc/scripts/review-denials.sh "$RUNNER_TEMP/claude-execution-output.json" "the first review"
            cp "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/review-attempt-1.json" 2>/dev/null || true
          fi
      # The first review may have posted threads: read them again for the retry.
      - name: Read the review threads again
        if: steps.posted.outputs.posted == 'false'
        run: |
          if ! .sdlc/scripts/review-threads.sh "$PR" > .review-threads.json 2> "$RUNNER_TEMP/review-threads.err"; then
            jq -n --arg e "$(tail -n 3 "$RUNNER_TEMP/review-threads.err" 2>/dev/null)" \
              '{unreadable: ("the review threads could not be read: " + $e)}' > .review-threads.json
          fi
          echo "Review threads: $(jq 'if type == "array" then length else "unreadable" end' .review-threads.json)"
      - name: Review once more
        id: retry
        if: steps.posted.outputs.posted == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs and pushes from the agent's own App identity (.sdlc/docs/agent-identity.md) are reviewed
          # like a person's, and so are spec PRs opened with the default token when there's no
          # App (github-actions[bot], #82). The review only comments, so it can't start a loop.
          # SDLC_REVIEW_EXTRA_BOTS adds the project's dependency bots (#142), e.g. `renovate` or
          # `renovate,dependabot`, so their PRs get reviewed and can pass the required check.
          # An unset variable leaves a blank entry, which the action ignores.
          allowed_bots: ${{ format('{0},github-actions,{1}', vars.SDLC_AGENT_APP_SLUG, vars.SDLC_REVIEW_EXTRA_BOTS) }}
          # The action holds inline comments back and drops any it judges to be tests once the
          # session ends. A dropped finding is a finding nothing blocks on (#130), so post them all.
          classify_inline_comments: false
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow the review rules in .review-rules.md exactly (.sdlc/REVIEW.md with this
            project's overrides applied). Check the diff against the spec.md and plan.md
            of the change it implements (under pr/changes/).

            The workspace root is the base branch, for the rules and context only. The PR's
            files, as of its head, are under pr/: review those, and `gh pr diff` for the diff.
            A comment's path is the repo's path, without pr/. A thread that starts with
            "CI change: needs approval" is this job's own: never post one yourself.

            This repo's SDLC_BUILD_AMENDS_PLAN variable is '${{ vars.SDLC_BUILD_AMENDS_PLAN }}'
            (`on` lets a build PR amend its plan: the rules' "A build PR that amends its plan").

            If the file .clause-check.json exists in the workspace, it is the clause check's
            output for the specs and plans this PR changes: start clause coverage from it, as
            the rules' "Where the clauses come from" says. If it doesn't exist, the PR changes
            no spec.md or plan.md.

            This PR may have been reviewed before. The file .review-threads.json lists its
            review threads as they were when this review started: each one's path, line,
            whether it is resolved or outdated, its first comment and its replies (`bot`
            is true for a bot or an App). Take thread state only from it. Never post a
            finding again whose thread is still unresolved, a needs-approval thread
            included. Post an inline comment only for a finding that is new or still not
            addressed in a different way. If the file holds {"unreadable": ...} instead,
            the threads couldn't be read: post no needs-approval thread that may already
            exist, and say in the summary that thread state couldn't be read.

            Every Important finding is its own thread starting with **Important (the rules'
            "Posting findings"), never only in the summary. When no line in the diff fits it,
            comment on the most relevant file with exactly:
              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments -f subject_type=file -f path=<file> -f commit_id=${{ github.event.pull_request.head.sha }} -f body=<finding>

            Keep exactly one summary comment on the PR. If you posted one before, replace it,
            but first read .review-earlier-summary.md: the summary you're replacing and the
            PR's commits. Mark each of its notes as the rules' "Summary comment" says. If it
            says it could not be read, say so in the summary. Post it with:
              gh pr comment ${{ github.event.pull_request.number }} ${{ steps.earlier.outputs.edit }}--body "..."
            The body is the whole summary. Never put a shorter one after `||`: if the command
            fails, run it again as its own command with the same whole body, without
            --edit-last if it failed because there is no comment to edit.
            A Nit with no thread is its own line in the summary, starting `- **Nit:**`. Never
            refer to a finding as "above": the PR shows only what you post.
            End it with the hidden count line, <!-- review-findings: important=<N> nit=<M> -->:
            N is the unresolved threads in .review-threads.json whose first comment is the
            review's own (author `claude`, bot true) and starts with **Important, plus the
            Important threads you post now. A resolved
            thread never counts. M is the Nits still open, in threads or in the summary. The
            job checks N against the open Important threads and that M Nits are written down,
            and fails if not.
          # Automation mode allows only the tools listed here: read the PR, comment on it.
          claude_args: >-
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments -f subject_type=file:*),Read,Grep,Glob"
      # The required `claude-review` status (auto-merge repos, #101). Success says what happened;
      # a Dependabot PR isn't AI-reviewed, so its description says a person reviews it by hand.
      # A green action isn't enough: it can end early (refused tools, the turn limit) having
      # posted nothing, so success needs the summary posted or edited during this job.
      # What the review read and ran, so a "No findings" can be checked: the tool calls only.
      - name: List the review's tool calls
        if: always() && steps.workflow_change.outputs.skipped != 'true'
        run: |
          if [[ -s "$RUNNER_TEMP/review-attempt-1.json" ]]; then
            .sdlc/scripts/review-denials.sh --calls "$RUNNER_TEMP/review-attempt-1.json" "the first review"
            .sdlc/scripts/review-denials.sh --calls "$RUNNER_TEMP/claude-execution-output.json" "the second review"
          else
            .sdlc/scripts/review-denials.sh --calls "$RUNNER_TEMP/claude-execution-output.json" "the review"
          fi
      - name: Mark the review as done
        id: done
        if: success()
        env:
          WHY: ${{ steps.workflow_change.outputs.why }}
          SINCE: ${{ steps.start.outputs.since }}
        run: |
          description="The Claude review is posted"
          if [[ "$WHY" == dependabot ]]; then
            description="No AI review: a Dependabot update, so a person reviews it by hand"
          elif ! .sdlc/scripts/review-posted.sh "$PR" "$SINCE"; then
            echo "reported=true" >> "$GITHUB_OUTPUT"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent -f state=failure \
              -f context=claude-review \
              -f description="The review ran but posted no summary: add the review label to run it again"
            exit 1
          # Each Important finding needs an open thread, or conversation resolution can't hold
          # the merge on it (#130): the gate checks what the review found, not only that it ran.
          elif ! reason="$(.sdlc/scripts/review-findings.sh "$PR")"; then
            echo "reported=true" >> "$GITHUB_OUTPUT"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent -f state=failure \
              -f context=claude-review \
              -f description="${reason:-The findings check could not run: add the review label to run it again}"
            exit 1
          fi
          # A "Descope: needs approval" thread waits for a person's decision, which the
          # thread's replies record (#132), and so does a "CI change: needs approval" one (#293). sdlc-descopes.yml re-checks it on each reply and
          # each review of the PR, since resolving a thread sends no event.
          if ! decided="$(.sdlc/scripts/descopes-decided.sh "$PR")"; then
            echo "reported=true" >> "$GITHUB_OUTPUT"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent -f state=failure \
              -f context=claude-review \
              -f description="$(cut -c1-140 <<<"${decided:-The descope check could not run: add the review label to run it again}")"
            exit 1
          fi
          [[ "$decided" == "no descopes to approve" ]] || description="$(cut -c1-140 <<<"$description; $decided")"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent -f state=success \
            -f context=claude-review -f description="$description"
      - name: Mark the review as failed
        if: failure() && steps.done.outputs.reported != 'true'
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent -f state=failure
          -f context=claude-review -f description="The Claude review failed: add the review label to run it again"
      # The evidence for #157: what the review was refused, in the log and as a 7-day artifact
      # (the session's tool calls and their output: the PR's own diff and comments, no secrets).
      - name: Show why the review stopped
        if: failure()
        run: .sdlc/scripts/review-denials.sh "$RUNNER_TEMP/claude-execution-output.json" "the review"
      - name: Keep the review's output
        if: always() && (failure() || steps.posted.outputs.posted == 'false')
        uses: actions/upload-artifact@v7
        with:
          name: claude-review-output-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/claude-execution-output.json
            ${{ runner.temp }}/review-attempt-1.json
          if-no-files-found: ignore
          retention-days: 7

  # A push the review doesn't cover (auto-merge off): mark its commit as not reviewed, so the
  # required `claude-review` status says why and what to do instead of "Expected" (#46). No
  # model call; .sdlc/scripts/review-current.sh leaves a commit that already has a status alone.
  unreviewed-push:
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (vars.SDLC_AUTO_MERGE == '' || vars.SDLC_AUTO_MERGE == 'off')
    runs-on: ${{ vars.SDLC_RUNNER && !github.event.issue.pull_request && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && vars.SDLC_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: write  # cancel a review still running on an older commit (#277)
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      # A push that only merges the base in keeps the review (#182), unless the repo sets
      # SDLC_REVIEW_CARRY_FORWARD to `off`.
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      SDLC_REVIEW_CARRY_FORWARD: ${{ vars.SDLC_REVIEW_CARRY_FORWARD }}
    steps:
      # Main's copy of the script, over the PR's commits as git objects (ADR 0001).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the PR's commits
        run: git fetch --quiet --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/$PR" "$HEAD_SHA"
      - run: .sdlc/scripts/review-current.sh "$PR" "$HEAD_SHA"
