name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ${{ vars.SDLC_RUNNER && (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && vars.SDLC_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # make validate compares the branch with main (changed-file limit)
      - uses: ./.github/actions/setup-stack
      - run: make check
