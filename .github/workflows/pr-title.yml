# PR titles become the commit messages that drive semantic versioning
# (scripts/next-version.sh) and the release notes, so they must follow the convention. A PR that
# changes a gate artifact (intent, bug, spec or plan) must also say so in its type (#46).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    runs-on: ${{ vars.SDLC_RUNNER && (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && vars.SDLC_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' \
            > "$RUNNER_TEMP/files.txt"
          scripts/check-pr-title.sh "$TITLE" < "$RUNNER_TEMP/files.txt"
