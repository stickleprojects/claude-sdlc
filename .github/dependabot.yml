# Framework-only (#143): keeps the actions in .github/workflows current, and actions.lock with
# them, and the uv that the setup-stack action installs (its requirements.txt, hashes included).
# The cooldown lets a fresh release settle before it's proposed, so a hijacked release has time
# to be noticed. The sync never ships this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # One PR for every action bump: they all edit actions.lock, so separate PRs conflict with
    # each other, and each merge costs the rest a rebase and a CI run.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github/actions/setup-stack
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
