<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">claude-sdlc: stages that Claude drafts, and a person approves</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a4a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g transform="translate(3 0)" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- the stages Claude drafts: intent, spec, plan -->
    <polyline points="16,44 34,64 16,84" stroke="#818cf8" opacity="0.45"/>
    <polyline points="38,44 56,64 38,84" stroke="#818cf8" opacity="0.75"/>
    <!-- the person's approval: the merge -->
    <polyline points="74,64 88,78 110,46" stroke="#4ade80"/>
  </g>
</svg>
