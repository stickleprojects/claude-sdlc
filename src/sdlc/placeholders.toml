# Words make validate reads as "nothing here" in an artifact section. Framework-owned: the sync
# replaces this file. To change the words for one repo, put a [placeholders] table in .sdlc.toml
# at the repo root (the sync never touches that file); each key there replaces the one below.
#
# There are two lists because "nothing here" is safe in opposite directions, so one list must
# never serve both.

[placeholders]
# For a section that must have content, such as an accepted ADR's "Revisit when". A line that is
# one of these (any case, ignoring a list marker and a trailing ".") names nothing, so a section
# with only these lines fails. Adding words here makes validate stricter.
nothing_written = ["none", "never", "n/a", "na", "tbd", "todo"]

# For a section that must be cleared, such as build.md's "Questions before approval" before the
# build is approved. Only an exact match (case and full stop included) means "nothing open";
# anything else, "TBD" included, reads as an open item. Adding words here makes validate looser.
explicit_none = ["None", "None."]
