[project]
name = "sdlc"
version = "0.1.0"
description = "Tooling for an AI-native SDLC pipeline (intent -> spec -> plan -> PR)"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sdlc = "sdlc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".sdlc/src/sdlc"]

[tool.ruff]
line-length = 100
src = [".sdlc/src", "tests"]

[tool.ruff.lint]
# S (bandit's security rules) since #135: downstream projects scan the framework's files with
# them, so the framework holds itself to them too. An exception is a `noqa` with its reason.
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, run git and the scripts under test from PATH, make scratch files, and build
# URLs the code must refuse.
"tests/**" = ["S101", "S603", "S607", "S108", "S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scenario: installs the framework into a consumer repo (slow); make check runs these only with FULL=1",
]
