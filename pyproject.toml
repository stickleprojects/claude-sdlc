[project]
name = "sdlc"
version = "0.1.0"
description = "Tooling for an AI-native SDLC pipeline (intent -> spec -> plan -> PR)"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sdlc = "sdlc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
